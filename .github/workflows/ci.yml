name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      # Lint is not run: the repository has no ESLint configuration yet.

      - name: Check site data against its build record and audit
        working-directory: frontend
        run: npm run check:data

      - name: Build (Vercel layout, one HTML file per school)
        working-directory: frontend
        run: npm run build

      - name: Cloudflare layout stays under the 20,000-file limit
        working-directory: frontend
        run: |
          SCHOOL_PAGES=worker node scripts/prerender.mjs
          count=$(find dist -type f | wc -l)
          echo "Cloudflare deployment would have $count files"
          test "$count" -le 20000
          test -f dist/_worker.js && test -f dist/_routes.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install ETL dependencies
        run: python -m pip install -r etl/requirements.txt

      - name: Compile ETL scripts
        run: python -m compileall -q etl

      - name: Import ETL modules
        run: python .github/scripts/etl_import_check.py
